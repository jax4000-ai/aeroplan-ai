spring.application.name=scheduling-service
spring.datasource.url=jdbc:h2:mem:schedulingdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Local/default profile uses H2 with Hibernate auto-DDL for fast iteration (including read-only
# mirrors of tables owned by work-order-service/event-processing-service). Production (see
# application-prod.properties) uses PostgreSQL against the already-migrated shared schema (see
# README: work-order-service owns and runs the one shared V1__init.sql migration).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=always
# Default to a different host port than work-order-service (8080) so both can run side by side
# during local/manual testing before docker-compose gives each its own network alias.
server.port=${PORT:8081}
logging.level.com.aeroplan=INFO

aeroplan.notification-service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8083}
scheduling.engine.weight.late-hours=10.0
scheduling.engine.weight.overtime-hours=4.0
scheduling.engine.weight.changed-assignments=1.0
scheduling.engine.standard-hours.start=7
scheduling.engine.standard-hours.end=19
