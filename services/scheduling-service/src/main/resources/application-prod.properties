spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# scheduling-service does not run its own Flyway migration in production: the shared Postgres
# schema (all four services' tables) is created once by work-order-service's V1__init.sql, which
# must run first against the RDS instance. This service only validates its entity mappings match
# the already-migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
