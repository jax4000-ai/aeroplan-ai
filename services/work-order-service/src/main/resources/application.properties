spring.application.name=work-order-service
spring.datasource.url=jdbc:h2:mem:workorderdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Local/default profile uses H2 with Hibernate auto-DDL for fast iteration. Production (see
# application-prod.properties) uses PostgreSQL with a hand-written Flyway migration
# (db/migration/V1__init.sql) that is the authoritative schema matching docs/data-model.md.
# Flyway is disabled here so H2 and the Postgres-specific migration never conflict.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=always
server.port=${PORT:8080}
logging.level.com.aeroplan=INFO
